name: Coletar dados

on:
  schedule:
    - cron: "23 * * * *"    # notícias de hora em hora
    - cron: "5 9 * * *"     # 6h05 de Brasília: Congresso com discursos + resumo do dia
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Notícias
        run: python coletar.py
        continue-on-error: true

      - name: Ver se é hora do Congresso
        id: hora
        run: echo "tres=$(( 10#$(date -u +%H) % 3 == 0 ))" >> "$GITHUB_OUTPUT"

      - name: Congresso e economia (a cada 3 horas)
        if: github.event.schedule == '23 * * * *' && steps.hora.outputs.tres == '1'
        run: python congresso.py
        continue-on-error: true

      - name: Congresso com discursos (1 vez por dia)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 9 * * *'
        run: python congresso.py --discursos
        continue-on-error: true

      - name: Agências públicas (texto integral)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 9 * * *' || steps.hora.outputs.tres == '1'
        run: python agencias.py
        continue-on-error: true

      - name: Resumo do dia
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 9 * * *'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python resumo.py
        continue-on-error: true

      - name: Salvar dados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Dados $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
