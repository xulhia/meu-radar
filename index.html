<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Meu Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<div class="deco" style="width:340px;height:340px;right:-140px;top:-120px;background:var(--deco-1)"></div>
<div class="deco" style="width:300px;height:300px;left:-150px;bottom:-130px;background:var(--deco-2)"></div>
<header class="top"><div class="wrap">
  <div class="top-row">
    <a class="brand" href="#hoje" aria-label="Meu Radar, início"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4"/><path d="M19 5a10 10 0 0 1 0 14"/><path d="M5 19A10 10 0 0 1 5 5"/></svg></span><b>Meu Radar</b></a>
    <label class="search" for="q"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="text" placeholder="Buscar nas notícias…" autocomplete="off"></label>
    <button type="button" class="toggle" id="calmo" aria-pressed="false"><span class="sw" aria-hidden="true"></span>Modo calmo</button>
  </div>
  <nav class="nav" aria-label="Seções">
    <a href="#hoje">Hoje</a>
    <a href="#noticias" data-calm-hide>Notícias</a>
    <a href="#congresso" data-calm-hide>Congresso</a>
    <a href="#termometro" data-calm-hide>Termômetro</a>
    <a href="#leitura">Leitura</a>
    <a href="#salvas">Salvas</a>
    <a href="#fontes" data-calm-hide>Fontes</a>
  </nav>
  <span class="demo-banner" style="background:var(--teal-soft)"><span id="healthDot" class="hdot"></span> <span id="upd">Carregando…</span></span>
</div></header>
<main class="wrap" id="app"><div class="empty"><span class="spin" aria-hidden="true"></span> Carregando…</div></main>
<footer class="foot"><div class="wrap">Painel pessoal. Notícias: só título e link de cada veículo. Congresso: API de Dados Abertos da Câmara. Economia: Banco Central. Ajustes em config/ no GitHub.</div></footer>
<div id="toastRoot" aria-live="polite"></div>
<script src="assets/app.js"></script>
</body>
</html>
